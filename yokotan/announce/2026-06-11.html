<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
<title>中旬の予定</title>
<style>
  @font-face {
    font-family: "じゆうちょう";
    src: url("../../font/Jiyucho.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "Corporate Logo Rounded ver3";
    src: url("../../font/Corporate-Logo-Rounded-Bold-ver3.otf") format("opentype");
    font-display: swap;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh; /* モバイルのアドレスバー分の誤差を吸収 */
  }

  .frame {
    position: relative;
    /* 背景画像の実寸: 852 x 1847 (縦横比 852/1847 ≈ 0.4613) */
    width: min(869px, 100vw, calc(100vh * 0.4613));  /* dvh未対応ブラウザ向けフォールバック */
    width: min(869px, 100vw, calc(100dvh * 0.4613));
    aspect-ratio: 852 / 1847;
    margin: 0 auto;
    line-height: 0; /* 画像下の余白防止 */
    container-type: inline-size; /* 文字サイズをフレーム実幅基準にする */
  }

  .frame img.bg {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* 画像左上(1%,5%)〜(55%,50%)の領域 */
  .overlay {
    position: absolute;
    left: 1%;
    top: 5%;
    width: 54%;   /* 55% - 1% */
    height: 45%;  /* 50% - 5% */
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .title {
    font-family: "じゆうちょう", sans-serif;
    color: #ffe000;
    font-size: 5vw;
    font-size: 5cqw;
    line-height: 1.15;
    text-align: center;
    white-space: nowrap;
    -webkit-text-stroke: 0.06em #c00000;
    text-stroke: 0.06em #c00000;
    paint-order: stroke fill;
    text-shadow:
      -1px -1px 0 #c00000,
       1px -1px 0 #c00000,
      -1px  1px 0 #c00000,
       1px  1px 0 #c00000;
    margin: 0 0 3.6cqw 0;
  }

  table.schedule {
    border-collapse: collapse;
    border: none;
    background: transparent;
    width: auto;
  }

  table.schedule td {
    vertical-align: top;
    border: none;
    padding: 0.4cqw 0.5cqw;
    font-family: "Corporate Logo Rounded ver3", sans-serif;
    color: #ff4d6d;
    font-size: 3.168cqw;
    line-height: 2.8;
    white-space: nowrap;
  }

  table.schedule td span.pill {
    display: inline-block;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 0.6em;
    padding: 0.1em 0.5em;
    line-height: 1.3; /* セルの行間(2.8)とは独立して背景の高さを維持 */
  }

  table.schedule td.day {
    text-align: right;
  }

  table.schedule td.youbi {
    text-align: center;
  }

  table.schedule td.desc {
    text-align: left;
    white-space: normal;
  }
</style>
</head>
<body>

<div class="frame">
  <img class="bg" src="2026-06-11.png" alt="background">

  <div class="overlay">
    <div class="title">🌞中旬の予定🌞</div>

    <table class="schedule">
      <tr>
        <td class="day"><span class="pill">11</span></td>
        <td class="youbi"><span class="pill">(木)</span></td>
        <td class="desc"><span class="pill">元気だったら23〜0時</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">12</span></td>
        <td class="youbi"><span class="pill">(金)</span></td>
        <td class="desc"><span class="pill">昼＆23〜0時</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">13</span></td>
        <td class="youbi"><span class="pill">(土)</span></td>
        <td class="desc"><span class="pill">23時〜日跨ぎ</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">14</span></td>
        <td class="youbi"><span class="pill">(日)</span></td>
        <td class="desc"><span class="pill">お休み🧉</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">15</span></td>
        <td class="youbi"><span class="pill">(月)</span></td>
        <td class="desc"><span class="pill">元気だったら23〜0時</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">16</span></td>
        <td class="youbi"><span class="pill">(火)</span></td>
        <td class="desc"><span class="pill">温泉旅行♨</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">17</span></td>
        <td class="youbi"><span class="pill">(水)</span></td>
        <td class="desc"><span class="pill">帰宅 23時〜日跨ぎ</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">18</span></td>
        <td class="youbi"><span class="pill">(木)</span></td>
        <td class="desc"><span class="pill">お休み🧉</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">19</span></td>
        <td class="youbi"><span class="pill">(金)</span></td>
        <td class="desc"><span class="pill">元気だったら23〜0時</span></td>
      </tr>
      <tr>
        <td class="day"><span class="pill">20</span></td>
        <td class="youbi"><span class="pill">(土)</span></td>
        <td class="desc"><span class="pill">22時半〜0時</span></td>
      </tr>
    </table>
  </div>
</div>

</body>
</html>
